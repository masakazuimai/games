<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アイコン書き出し用テンプレート</title>
<!-- 制作用の作業ファイルなので検索結果には出さない -->
<meta name="robots" content="noindex, nofollow">
<!--
  ホーム画面アイコンの元データ。Playwrightで #any / #maskable を512pxで撮影し、
  sipsで192・180へ縮小して assets/ に置く。デザインを直すときはここを編集して撮り直す。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #444;
    display: flex;
    gap: 40px;
    font-family: "JetBrains Mono", monospace;
  }
  .icon {
    width: 512px;
    height: 512px;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* CRTの走査線。本体のトンマナと揃える */
  .icon::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.03) 0 2px,
      transparent 2px 6px
    );
  }
  .glyph {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #ffb000;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    text-shadow: 0 0 32px rgba(255, 176, 0, 0.45);
  }
  .cursor {
    display: block;
    background: #ffb000;
    box-shadow: 0 0 32px rgba(255, 176, 0, 0.45);
  }

  /* 通常アイコン: 端まで使い、内側にターミナル枠を1本入れる */
  #any .glyph { font-size: 190px; }
  #any .cursor { width: 96px; height: 190px; }
  #any .frame {
    position: absolute;
    inset: 34px;
    border: 4px solid rgba(255, 176, 0, 0.32);
  }

  /* マスカブル: 外周20%が削られる前提で、中央60%に収める */
  #maskable .glyph { font-size: 132px; }
  #maskable .cursor { width: 66px; height: 132px; }
</style>
</head>
<body>
  <div class="icon" id="any">
    <div class="frame"></div>
    <div class="glyph">Q&gt;<span class="cursor"></span></div>
  </div>

  <div class="icon" id="maskable">
    <div class="glyph">Q&gt;<span class="cursor"></span></div>
  </div>
</body>
</html>
